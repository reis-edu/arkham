name: Deploy to production

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dashboard.render.com/web/${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 300 ]; then
            echo "::error::Falha ao disparar deploy no Render ($http_code): $body"
            exit 1
          fi

          deploy_id=$(echo "$body" | jq -r '.id')
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Deploy disparado: $deploy_id (tag ${GITHUB_REF_NAME})"

      - name: Aguardar conclusão do deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 80); do
            status=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')

            echo "Status do deploy: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Deploy no Render terminou com status '$status'"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Timeout esperando o deploy no Render terminar"
          exit 1
